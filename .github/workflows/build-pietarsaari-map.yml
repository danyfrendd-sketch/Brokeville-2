name: Build Pietarsaari map data

on:
  workflow_dispatch:
  push:
    paths:
      - "map/tools/download_pietarsaari_osm.py"
      - "map/tools/render_pietarsaari_map.py"
      - ".github/workflows/build-pietarsaari-map.yml"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download OSM geometry
        run: python map/tools/download_pietarsaari_osm.py
      - name: Validate downloaded GeoJSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("map/data/pietarsaari_osm.geojson")
          data = json.loads(p.read_text(encoding="utf-8"))
          features = data.get("features", [])
          print(f"GeoJSON: {p}; features: {len(features)}; bytes: {p.stat().st_size}")
          if not features:
              raise SystemExit("No features were downloaded")
          from collections import Counter
          print("Top tags:", Counter(
              k for f in features for k in (f.get("properties") or {}).keys()
          ).most_common(20))
          PY
      - name: Render styled vector map
        run: python map/tools/render_pietarsaari_map.py
      - name: Build 3D terrain and buildings
        run: |
          python -m pip install --disable-pip-version-check numpy trimesh shapely mapbox-earcut
          python map/tools/build_pietarsaari_3d.py
      - name: Publish SVG preview to repository
        run: |
          mkdir -p map/preview
          cp map/data/pietarsaari_map.svg map/preview/pietarsaari-map.svg
      - name: Commit updated SVG preview
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build updated Pietarsaari map preview"
          file_pattern: map/preview/pietarsaari-map.svg
      - name: Upload map outputs
        uses: actions/upload-artifact@v4
        with:
          name: pietarsaari-map-build
          path: |
            map/data/pietarsaari_osm.geojson
            map/data/pietarsaari_map.svg
            map/data/pietarsaari_3d.glb
          if-no-files-found: error
          retention-days: 30
