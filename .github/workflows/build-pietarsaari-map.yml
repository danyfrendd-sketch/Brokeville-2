name: Protect current Pietarsaari map

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow intentionally does NOT download map data, rebuild the map, or replace
# the existing GLB. The current map in map/preview/pietarsaari_3d.glb is the source of truth.
jobs:
  verify-current-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current project
        uses: actions/checkout@v4
      - name: Verify existing map files without downloading anything
        run: |
          test -s map/preview/pietarsaari_3d.glb
          test -s play.html
          echo "Using the existing map only. No OSM download or map rebuild was run."
